services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: eve }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 3s, retries: 10 }
  api:
    build: .
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/eve
      JWT_SECRET: change-me
      WEBHOOK_SECRET: change-me-too
      ADMIN_EMAILS: admin@example.com
